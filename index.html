<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050509">

<title>Workout Tracker Pro</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg">

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#050509;
  color:#fff;
}

.app{
  max-width:600px;
  margin:auto;
  padding:18px;
}

h1{
  text-align:center;
  margin:8px 0 4px;
  font-size:30px;
}

.sub{
  text-align:center;
  color:#999;
  margin-bottom:22px;
}

.card{
  background:#101016;
  border:1px solid #292933;
  border-radius:18px;
  padding:18px;
  margin-bottom:15px;
}

h2{
  margin-top:0;
}

.exercise{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px;
  margin:8px 0;
  background:#181820;
  border-radius:12px;
}

.exercise input{
  width:21px;
  height:21px;
}

.exercise span{
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:12px;
  margin-top:9px;
  font-size:16px;
  font-weight:bold;
  background:#fff;
  color:#000;
}

button.secondary{
  background:#22222b;
  color:#fff;
}

button.danger{
  background:#35151b;
  color:#fff;
}

button.install{
  background:#ffffff;
  color:#000;
  display:none;
}

.status{
  text-align:center;
  color:#aaa;
  margin:10px 0;
}

.timer{
  font-size:52px;
  text-align:center;
  font-weight:bold;
  letter-spacing:2px;
  margin:10px 0;
}

.tracker{
  display:none;
}

video{
  width:100%;
  border-radius:16px;
  background:#000;
  display:none;
  transform:scaleX(-1);
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.stat{
  background:#181820;
  border-radius:12px;
  padding:14px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:25px;
  margin-top:5px;
}

#cameraStatus{
  color:#7ee787;
}
</style>
</head>

<body>

<div class="app">

<h1>⚡ WORKOUT TRACKER</h1>

<div class="sub">
48 Minute Training System
</div>

<!-- INSTALL -->
<div class="card">
<button class="install" id="installBtn">
📱 INSTALL WORKOUT APP
</button>
</div>


<!-- EXERCISES -->

<div class="card">

<h2>🏋️ Select Exercises</h2>

<label class="exercise">
<input type="checkbox" class="exerciseCheck" value="Squats">
<span>Squats</span>
</label>

<label class="exercise">
<input type="checkbox" class="exerciseCheck" value="Push Ups">
<span>Push Ups</span>
</label>

<label class="exercise">
<input type="checkbox" class="exerciseCheck" value="Jumping Jacks">
<span>Jumping Jacks</span>
</label>

<label class="exercise">
<input type="checkbox" class="exerciseCheck" value="Lunges">
<span>Lunges</span>
</label>

<label class="exercise">
<input type="checkbox" class="exerciseCheck" value="Plank">
<span>Plank</span>
</label>

<label class="exercise">
<input type="checkbox" class="exerciseCheck" value="Mountain Climbers">
<span>Mountain Climbers</span>
</label>

<label class="exercise">
<input type="checkbox" class="exerciseCheck" value="High Knees">
<span>High Knees</span>
</label>

<label class="exercise">
<input type="checkbox" class="exerciseCheck" value="Sit Ups">
<span>Sit Ups</span>
</label>

<button onclick="startWorkout()">
▶ START WORKOUT
</button>

<button class="secondary" onclick="resetSelection()">
RESET SELECTION
</button>

</div>


<!-- WORKOUT -->

<div class="card tracker" id="tracker">

<h2>🎯 Active Workout</h2>

<div class="timer" id="timer">
48:00
</div>

<div class="status" id="workoutStatus">
Workout ready
</div>


<div class="stats">

<div class="stat">
Selected
<b id="selectedCount">0</b>
</div>

<div class="stat">
Detected Reps
<b id="repCount">0</b>
</div>

</div>


<br>


<!-- CAMERA -->

<div class="card" style="margin:0">

<h2>📷 Camera Tracking</h2>

<div class="status" id="cameraStatus">
Camera not started
</div>

<video
id="camera"
autoplay
playsinline>
</video>

<button
class="secondary"
onclick="startCamera()">
📷 START CAMERA
</button>

<button
class="danger"
onclick="stopCamera()">
■ STOP CAMERA
</button>

</div>


<button
class="secondary"
onclick="pauseTimer()"
id="pauseBtn">
Ⅱ PAUSE
</button>


<button
class="danger"
onclick="stopWorkout()">
■ END WORKOUT
</button>

</div>

</div>


<script>

/* =================================
   EXERCISE SAVE
================================= */

const checks =
document.querySelectorAll(".exerciseCheck");


checks.forEach((box,index)=>{

  const saved =
  localStorage.getItem("exercise_"+index);

  box.checked =
  saved === "true";


  box.addEventListener("change",()=>{

    localStorage.setItem(
      "exercise_"+index,
      box.checked
    );

  });

});


/* =================================
   TIMER
================================= */

let totalSeconds = 48 * 60;

let timerInterval = null;

let paused = false;


function updateTimer(){

  const min =
  Math.floor(totalSeconds / 60);

  const sec =
  totalSeconds % 60;

  document.getElementById("timer")
  .textContent =
    String(min).padStart(2,"0")
    + ":" +
    String(sec).padStart(2,"0");

}


function startTimer(){

  if(timerInterval)
    return;


  timerInterval =
  setInterval(()=>{

    if(!paused && totalSeconds > 0){

      totalSeconds--;

      updateTimer();

    }


    if(totalSeconds <= 0){

      clearInterval(timerInterval);

      timerInterval = null;

      document.getElementById(
        "workoutStatus"
      ).textContent =
      "✅ Workout complete";

    }

  },1000);

}


function pauseTimer(){

  paused = !paused;

  document.getElementById(
    "pauseBtn"
  ).textContent =
  paused ? "▶ RESUME" : "Ⅱ PAUSE";

}


/* =================================
   START WORKOUT
================================= */

function startWorkout(){

  const selected =
  [...checks].filter(
    box => box.checked
  );


  if(selected.length === 0){

    alert(
      "Please select at least one exercise."
    );

    return;

  }


  document.getElementById(
    "tracker"
  ).style.display =
  "block";


  document.getElementById(
    "selectedCount"
  ).textContent =
  selected.length;


  document.getElementById(
    "workoutStatus"
  ).textContent =
  "Workout started";


  totalSeconds =
  48 * 60;

  paused = false;

  updateTimer();

  startTimer();


  window.scrollTo({

    top:
    document.body.scrollHeight,

    behavior:"smooth"

  });

}


/* =================================
   STOP WORKOUT
================================= */

function stopWorkout(){

  clearInterval(timerInterval);

  timerInterval = null;

  totalSeconds =
  48 * 60;

  paused = false;

  updateTimer();

  document.getElementById(
    "tracker"
  ).style.display =
  "none";

  stopCamera();

}


/* =================================
   RESET
================================= */

function resetSelection(){

  checks.forEach((box,index)=>{

    box.checked = false;

    localStorage.removeItem(
      "exercise_"+index
    );

  });

}


/* =================================
   CAMERA
================================= */

let stream = null;


async function startCamera(){

  const video =
  document.getElementById("camera");


  const status =
  document.getElementById(
    "cameraStatus"
  );


  if(!navigator.mediaDevices){

    status.textContent =
    "❌ Camera not supported";

    return;

  }


  try{

    stream =
    await navigator.mediaDevices
    .getUserMedia({

      video:{
        facingMode:"user",
        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:false

    });


    video.srcObject =
    stream;

    video.style.display =
    "block";


    status.textContent =
    "🟢 Camera active";

  }


  catch(error){

    status.textContent =
    "❌ Camera permission required";


    alert(
      "Camera permission Allow karo."
    );

  }

}


function stopCamera(){

  const video =
  document.getElementById(
    "camera"
  );


  if(stream){

    stream
    .getTracks()
    .forEach(
      track => track.stop()
    );

    stream = null;

  }


  video.srcObject = null;

  video.style.display =
  "none";


  document.getElementById(
    "cameraStatus"
  ).textContent =
  "Camera stopped";

}


/* =================================
   REP COUNTER
================================= */

let reps = 0;


function addRep(){

  reps++;


  document.getElementById(
    "repCount"
  ).textContent =
  reps;

}


/* =================================
   SERVICE WORKER
================================= */

if("serviceWorker" in navigator){

  window.addEventListener(
    "load",
    ()=>{

      navigator.serviceWorker
      .register("./sw.js")
      .then(()=>{

        console.log(
          "Service Worker registered"
        );

      })
      .catch(error=>{

        console.log(
          "Service Worker error:",
          error
        );

      });

    }
  );

}


/* =================================
   INSTALL APP
================================= */

let deferredPrompt = null;

const installBtn =
document.getElementById(
  "installBtn"
);


window.addEventListener(
"beforeinstallprompt",
(event)=>{

  event.preventDefault();

  deferredPrompt =
  event;

  installBtn.style.display =
  "block";

});


installBtn.addEventListener(
"click",
async ()=>{

  if(!deferredPrompt)
    return;


  deferredPrompt.prompt();


  const result =
  await deferredPrompt.userChoice;


  console.log(
    "Install:",
    result.outcome
  );


  deferredPrompt = null;

  installBtn.style.display =
  "none";

});


window.addEventListener(
"appinstalled",
()=>{

  installBtn.style.display =
  "none";

  console.log(
    "Workout Tracker installed"
  );

});

</script>

</body>
</html>
