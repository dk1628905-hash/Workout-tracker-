<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#030912"><link rel="manifest" href="manifest.json"><title>Workout Tracker</title><style>*{box-sizing:border-box}body{margin:0;background:#030912;color:#eaf4ff;font:15px Arial,sans-serif}.app{max-width:900px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center}.logo{font-size:24px;font-weight:900}.logo b{color:#16d9ff}.card{background:#071321;border:1px solid #123457;border-radius:16px;padding:18px;margin-top:16px;box-shadow:0 0 25px #00152b}h1,h2,h3{margin-top:0}.muted{color:#7890a8}.progress{height:12px;background:#10263c;border-radius:20px;overflow:hidden;margin:15px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,#37f29b,#16d9ff,#168cff)}.task{display:grid;grid-template-columns:35px 1fr 60px;gap:8px;align-items:center;padding:14px 4px;border-top:1px solid #10283f}.task input{width:21px;height:21px;accent-color:#37f29b}.done{text-decoration:line-through;color:#60778b}.stats{display:flex;justify-content:space-between;color:#8298ad;margin:8px 0}.btn{padding:11px 15px;border:1px solid #145485;background:#071c30;color:#fff;border-radius:10px;font-weight:bold}.primary{background:linear-gradient(90deg,#076eff,#08b9ff);border:0}.circle{width:140px;height:140px;border-radius:50%;margin:15px auto;background:conic-gradient(#35ef9a var(--p,0%),#10263c 0);display:grid;place-items:center;position:relative}.circle:after{content:"";position:absolute;width:108px;height:108px;border-radius:50%;background:#071321}.circle b{position:relative;z-index:2;font-size:25px}@media(max-width:600px){.app{padding:12px}}</style></head><body><div class="app"><div class="head"><div><div class="logo">🏋️ WORKOUT <b>TRACKER</b></div><div class="muted">Dark Gaming • 48 Minute Routine</div></div><button class="btn" id="install" hidden>📲 Install</button></div><div class="card"><h2>⚡ Today's Workout</h2><div class="stats"><span id="count">0 / 7 completed</span><span id="mins">0 / 48 min</span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="tasks"></div><p><button class="btn primary" id="start">▶ Start 48 Min Timer</button> <button class="btn" id="reset">↻ Reset</button></p><h3 id="timer">48:00</h3></div><div class="card"><h3>📊 Progress</h3><div class="circle" id="circle"><b id="pct">0%</b></div></div></div><script>const ex=[['Warm-up','Light movement & mobility',5],['Squats','Bodyweight squats',8],['Push-ups','Comfortable reps',7],['Lunges','Alternating lunges',7],['Core / Plank','Controlled core work',6],['Cardio','Brisk walk / light cardio',10],['Cool-down','Stretching & breathing',5]];const key='workout-'+new Date().toISOString().slice(0,10);let done=JSON.parse(localStorage.getItem(key)||'[]'),sec=2880,timerId;function render(){const box=document.getElementById('tasks');box.innerHTML='';ex.forEach((x,i)=>{const r=document.createElement('div');r.className='task';r.innerHTML='<input type="checkbox" '+(done[i]?'checked':'')+'><div class="'+(done[i]?'done':'')+'"><b>'+x[0]+'</b><br><small>'+x[1]+'</small></div><small>'+x[2]+'m</small>';r.querySelector('input').onchange=e=>{done[i]=e.target.checked;localStorage.setItem(key,JSON.stringify(done));render()};box.appendChild(r)});let n=done.filter(Boolean).length,m=done.reduce((s,v,i)=>s+(v?ex[i][2]:0),0),p=Math.round(n/7*100);document.getElementById('count').textContent=n+'/7 completed';document.getElementById('mins').textContent=m+'/48 min';document.getElementById('pct').textContent=p+'%';document.getElementById('bar').style.width=p+'%';document.getElementById('circle').style.setProperty('--p',p+'%')}document.getElementById('reset').onclick=()=>{done=[];localStorage.removeItem(key);render()};document.getElementById('start').onclick=()=>{if(timerId)return;timerId=setInterval(()=>{sec--;let m=Math.floor(sec/60),s=sec%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');if(sec<=0){clearInterval(timerId);timerId=null;alert('Workout complete! 🔥')}},1000)};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');let deferred;addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;document.getElementById('install').hidden=false});document.getElementById('install').onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}};render();</script></body></html>
